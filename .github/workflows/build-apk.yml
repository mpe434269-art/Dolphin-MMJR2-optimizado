name: Build APK (MMJR2 optimizado)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Descargar el zip desde el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0 --repo "${{ github.repository }}" --pattern "*.zip" --dir /tmp/dl
          ls -la /tmp/dl
          mkdir -p "$HOME/src"
          unzip -q /tmp/dl/*.zip -d "$HOME/src"
          CM=$(find "$HOME/src" -maxdepth 3 -name CMakeLists.txt -path "*/*/CMakeLists.txt" | head -1)
          echo "SRC=$(dirname "$CM")" >> "$GITHUB_ENV"

      - name: Comprobar que es la versi贸n optimizada
        run: |
          f="$SRC/Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/utils/AutoPerformanceProfile.java"
          if [ ! -f "$f" ]; then
            echo "::error::El zip del Release es el ORIGINAL (sin las optimizaciones). Sube Dolphin-MMJR2-optimizado.zip al Release."
            exit 1
          fi
          grep -q "DCMAKE_BUILD_TYPE=Release" "$SRC/Source/Android/app/build.gradle"

      # El zip de GitHub NO trae los subm贸dulos (Externals/*): vienen vac铆os.
      # Los descargamos del repo original en las versiones exactas que fija ese repo.
      - name: Descargar subm贸dulos (Externals)
        run: |
          set -e
          cd /tmp
          ok=0
          for url in \
            "https://github.com/Medard22/Dolphin-MMJR2-VBI.git" \
            "https://github.com/Lumince/Dolphin-MMJR2.git"; do
            rm -rf upstream
            if git clone --depth 1 "$url" upstream; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "::error::No pude clonar el repo original para los subm贸dulos"; exit 1; }
          cd upstream
          PATHS=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}' | grep -v -E 'Externals/(Qt|FFmpeg-bin)$')
          git submodule update --init --recursive --depth 1 $PATHS
          for p in $PATHS; do
            if [ -d "$p" ] && [ -n "$(ls -A "$p")" ]; then
              rm -rf "$SRC/$p"
              mkdir -p "$(dirname "$SRC/$p")"
              cp -a "$p" "$SRC/$p"
              find "$SRC/$p" -name .git -prune -exec rm -rf {} +
            else
              echo "::warning::Subm贸dulo vac铆o: $p"
            fi
          done
          echo "Subm贸dulos que siguen vac铆os:"
          for p in $PATHS; do [ -z "$(ls -A "$SRC/$p" 2>/dev/null)" ] && echo " - $p"; done || true

      - name: Preparar git y corregir build.gradle
        run: |
          cd "$SRC"
          sed -i "s/logger.error(e + ':/logger.error(e.toString() + ':/" Source/Android/app/build.gradle
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci"
          git add -A >/dev/null 2>&1
          git commit -q -m "build" >/dev/null 2>&1 || true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Crear llave de firma
        working-directory: ${{ env.SRC }}/Source/Android
        run: |
          keytool -genkeypair -keystore "$PWD/release.jks" -storepass android123 \
            -keypass android123 -alias mmjr -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MMJR, OU=Dev, O=Dev, L=X, S=X, C=US"
          printf 'storeFile=%s\nstorePassword=android123\nkeyAlias=mmjr\nkeyPassword=android123\n' \
            "$PWD/release.jks" > keystore.properties

      - name: Compilar APK release
        working-directory: ${{ env.SRC }}/Source/Android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee "$HOME/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            echo "=================== RESUMEN DEL ERROR ==================="
            grep -n -A15 "What went wrong" "$HOME/build.log" | head -60
            echo "----- l铆neas con error -----"
            grep -n -i -E "CMake Error|error:|fatal error|undefined reference|No such file|FAILED" "$HOME/build.log" | head -40
          fi
          exit $code

      - name: Subir log (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/build.log
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-MMJR2-optimizado-apk
          path: ${{ env.SRC }}/Source/Android/app/build/outputs/apk/release/*.apk
